spring:
  application:
    name: BookTalk

  datasource:
    url: jdbc:postgresql://localhost:5432/booktalk
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 900
    issuer: BookTalk